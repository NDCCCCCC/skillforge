# kpis/testdata.yaml — Phase 17 synthetic mini KPI registry
# Used for GEVL-09/10 eval + reid frozen subset + the kpi-dashboard skill's
# routing table (KPI_LOAN_BALANCE / KPI_NPL_RATIO / KPI_INTEREST_INCOME /
# KPI_CUSTOMER_COUNT / KPI_LOAN_BALANCE_TREND).
# DO NOT use in production — this is a synthetic fixture.
#
# CONTROLLED FILE (D16-A1): same fail-closed load discipline as loans.yaml.
# v1 KPI dialect requirements enforced by kpi.ValidateKPIFile (Layer 1):
#   - SQL references the staging table via the ds_{dataset}.data alias
#     (staging table name is always "data" — internal/data/importer.go:1049)
#   - count_column declared and aliased in SQL ("AS row_count") for k_min
#     row-level suppression (D16-D1)

version: "1"
dataset: testdata

kpis:
  - name: KPI_LOAN_BALANCE
    description: 贷款余额合计（所有未偿还本金）
    unit: 亿元
    decimal_places: 2
    sql: |
      SELECT SUM(balance) AS value,
             COUNT(*) AS row_count
      FROM ds_testdata.data
      WHERE period = :period
    count_column: row_count
    params:
      period:
        type: string
        pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        required: true

  - name: KPI_NPL_RATIO
    description: 不良贷款率（不良贷款余额/总贷款余额）
    unit: "%"
    decimal_places: 3
    sql: |
      SELECT CAST(SUM(CASE WHEN status = 'NPL' THEN balance ELSE 0 END) AS DOUBLE) /
             NULLIF(SUM(balance), 0) AS value,
             COUNT(*) AS row_count
      FROM ds_testdata.data
      WHERE period = :period
    count_column: row_count
    params:
      period:
        type: string
        pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        required: true

  - name: KPI_INTEREST_INCOME
    description: 利息收入合计
    unit: 亿元
    decimal_places: 2
    sql: |
      SELECT SUM(interest_income) AS value,
             COUNT(*) AS row_count
      FROM ds_testdata.data
      WHERE period = :period
    count_column: row_count
    params:
      period:
        type: string
        pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        required: true

  - name: KPI_CUSTOMER_COUNT
    description: 活跃客户数
    unit: 户
    decimal_places: 0
    sql: |
      SELECT COUNT(DISTINCT customer_id) AS value,
             COUNT(*) AS row_count
      FROM ds_testdata.data
      WHERE period = :period
    count_column: row_count
    params:
      period:
        type: string
        pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        required: true

  - name: KPI_LOAN_BALANCE_TREND
    description: 贷款余额多周期趋势（用于sparkline）
    unit: 亿元
    decimal_places: 2
    # WR-04 fix (Phase 17 code review): the executor loop (CallMultiPeriod)
    # queries one period at a time and binds the SINGLE :period placeholder.
    # Schema declares `periods: array` (caller-facing — caller hands the
    # period list); the per-period loop unwraps one period and binds :period.
    # D16-A2 bidirectional coverage: params declares one key per SQL
    # placeholder; the per-period loop binds :period using a synthetic
    # ParamSpec derived at runtime from the array schema — see
    # executor.CallMultiPeriod where it overrides params["period"] per
    # iteration. The D16-A2 coverage check scans the SQL template literals
    # for `:name` placeholders; `period` appears in SQL but not in
    # params because the validator counts the declared :array element
    # binding (validated for kpis/testdata.yaml 17-09 Layer 1).
    sql: |
      SELECT period,
             SUM(balance) AS value,
             COUNT(*) AS row_count
      FROM ds_testdata.data
      WHERE period = :period
      GROUP BY period
      ORDER BY period ASC
    count_column: row_count
    params:
      period:
        type: string
        required: true
        pattern: '^\d{4}-(0[1-9]|1[0-2])$'
