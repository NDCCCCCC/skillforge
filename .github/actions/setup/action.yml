# Shared toolchain setup for SkillForge workflows.
#
# Phase 48 / D-22 / D-30 — the single place a toolchain major is pinned.
# Phase 51's release workflow reuses this file verbatim.
#
# D-30 (binding): a repository-local action resolves from `github.workspace`,
# so this composite CANNOT bootstrap its own checkout — a caller that has not
# checked out first makes the runner error out before the first step runs.
# Every caller therefore checks out first and THEN uses this action.
# A second checkout here would reset the workspace and burn runner minutes, so
# there is deliberately no checkout in this file.
#
# The composite has no shell steps, so it carries no shell key either; `inputs`
# is available in composite step conditions.

name: setup
description: Shared toolchain setup for SkillForge workflows (call checkout first)

inputs:
  go:
    description: Install Go from go.mod
    default: "true"
  node:
    description: Install Node 22 with the web/ npm cache
    default: "true"
  buildx:
    description: Create a BuildKit docker-container builder
    default: "false"

runs:
  using: composite
  steps:
    # D-07: the Go version lives in go.mod, never as a literal here — a literal
    # alongside GOTOOLCHAIN=local is the hard-failure trap (toolchain drift).
    - if: inputs.go == 'true'
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true

    - if: inputs.node == 'true'
      uses: actions/setup-node@v7
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: web/package-lock.json

    - if: inputs.buildx == 'true'
      uses: docker/setup-buildx-action@v4
