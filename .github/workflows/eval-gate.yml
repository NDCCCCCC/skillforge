#
# 演进门禁 —— 「Skill 变更必须过冻结评测才能晋级」的强制点。
#
# 本文件分两级，刻意分开：
#
#   lock-integrity  无需任何密钥，永远运行，**刚性阻断**。
#                   它比对 eval/frozen/*.lock.json 里钉住的 prompt_hash 与
#                   当前实际发送的 prompt 是否一致。改了 prompt / Skill
#                   正文却没重新冻结 → 这里红。
#
#   live-eval       需要 LLM + 向量端点密钥，配置了才跑。
#                   它跑真实评测并应用每个 Skill 的 eval-gate.json 阈值。
#                   未配置密钥时**明确声明跳过**并让 job 保持中性状态
#                   （neutral，不是 success）—— 门禁不能靠「没配密钥」变成
#                   装饰。
#
# 为什么这两级都要有：lock-integrity 只能证明「冻结的评测对象没变」，
# 证明不了「质量没退」。live-eval 才能回答后者。反过来，live-eval 需要
# 花钱和外部服务，不能作为每个 PR 的硬门槛，所以它按 secret 是否配置决定。

name: Eval Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'skills/**'
      - 'eval/**'
      - 'internal/agent/**'
      - 'internal/eval/**'
      - 'internal/platformfloor/**'
      - 'internal/knowledge/**'
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'eval/**'
      - 'internal/agent/**'
      - 'internal/eval/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25.5'

jobs:
  # ---------------------------------------------------------------------
  # 第一级：冻结完整性。无密钥、永远运行、刚性阻断。
  # ---------------------------------------------------------------------
  lock-integrity:
    name: Frozen lock integrity (no secrets needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Lock pin matches the shipped prompt
        # 这条测试断言 eval/frozen/<skill>.lock.json 的 prompt_hash 等于
        # 当前代码实际渲染出的 prompt 哈希。
        #
        # 它红了有两种可能，都需要人看一眼：
        #   1. 你改了 prompt / Skill 正文 —— 那就重跑 `go run ./cmd/eval
        #      -frozen <skill>` 重新冻结，并接受评测分数会变；或者
        #   2. 你不该改 prompt —— 那就回退。
        #
        # 这正是「Skill 晋级要过门」的最小可证明形式：拦住「悄悄改提示词
        # 而不重新评测」。
        run: |
          go test ./internal/eval/ -run TestShippedFrozenLockIsInSync -count=1 -v

      - name: Frozen lock files are all present
        run: |
          missing=0
          for s in skills/*/SKILL.md; do
            name=$(basename "$(dirname "$s")")
            if [ ! -f "eval/frozen/$name.lock.json" ]; then
              echo "::warning::skills/$name 没有冻结评测锁（eval/frozen/$name.lock.json）"
              missing=$((missing+1))
            fi
          done
          echo "缺少冻结锁的 Skill 数：$missing"
          # 只告警不阻断：新增 Skill 的第一天还没跑过评测是正常的，
          # 但它必须先跑一次才能算「晋级」。

  # ---------------------------------------------------------------------
  # 第二级：真实评测 + 阈值门禁。需要 secrets。
  # ---------------------------------------------------------------------
  live-eval:
    name: Live eval + per-Skill thresholds
    runs-on: ubuntu-latest
    # 只有配了密钥才跑；没配时 job 走 skipped（中性），不会伪装成通过。
    if: ${{ github.event_name == 'workflow_dispatch' || vars.EVAL_GATE_ENABLED == 'true' }}
    environment: eval
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify CGO toolchain
        run: gcc --version | head -n 1

      - name: Check secrets
        id: secrets
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          BGE_M3_URL: ${{ secrets.BGE_M3_URL }}
        run: |
          if [ -z "$GLM_API_KEY" ] || [ -z "$BGE_M3_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GLM_API_KEY / BGE_M3_URL 未配置 —— 跳过实测评测。"
            echo "这不是通过，是未验证。冻结完整性仍由 lock-integrity job 保证。"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run eval per Skill (frozen pin)
        if: steps.secrets.outputs.configured == 'true'
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          BGE_M3_URL: ${{ secrets.BGE_M3_URL }}
          BGE_M3_MODEL: bge-m3
        run: |
          set -euo pipefail
          mkdir -p eval-reports
          # 逐个 Skill 跑，保留每份报告：一个 Skill 退步不该掩盖另一个。
          for s in skills/*/SKILL.md; do
            name=$(basename "$(dirname "$s")")
            if [ ! -f "eval/frozen/$name.lock.json" ]; then
              echo "跳过 $name（无冻结锁）"
              continue
            fi
            echo "=== eval $name ==="
            go run ./cmd/eval \
              -frozen "$name" \
              -report "eval-reports/$name.json" \
              -calibration "eval-reports/$name.calibration.json"
          done

      - name: Apply per-Skill thresholds
        if: steps.secrets.outputs.configured == 'true'
        run: |
          set -euo pipefail
          fail=0
          for r in eval-reports/*.json; do
            # calibration 文件不是报告，跳过
            case "$r" in *.calibration.json) continue;; esac
            echo "=== gate-check $r ==="
            if ! go run ./cmd/eval -gate-check "$r" | tee -a gate.md; then
              fail=1
            fi
          done
          if [ -f gate.md ]; then
            {
              echo "## Eval gate"
              echo ""
              cat gate.md
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $fail

      - name: Upload eval reports
        if: always() && steps.secrets.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: eval-reports/
          if-no-files-found: warn
          retention-days: 30
