# Eval Gate — Phase 22 Task 22-01
#
# Runs the frozen compliance golden set (50 cases) on every PR + push to
# main, then applies the per-Skill threshold gate from
# examples/skills/<skill>/eval-gate.json. This is the GEVL-07 / SC-2
# promotion gate (D6-11).
#
# Behaviour:
#   - PR + push to main: run frozen replay + gate check
#   - workflow_dispatch: run as "manual" with optional judge-model override
#
# Gates:
#   - faithfulness  >=  0.90 (cross-Skill floor)
#   - refusal_accuracy derived from per-category refusal-required refusal
#     rate; Skill-specific thresholds live in eval-gate.json.
#
# What this workflow DOES NOT do (out of scope for Phase 22):
#   - It does not pin the production LLM (production gates stay on
#     GLM_CODING via --frozen + AssertPin; CI uses the ambient
#     JUDGE_MODEL / GLM_API_KEY secrets). A pinned run is a manual
#     nightly job.
#   - It does not backfill live eval reports (separate cron).
#
# Required secrets (set in repo Settings → Secrets):
#   - GLM_API_KEY    — Coding Plan key (the live judge LLM)
#   - BGE_M3_URL     — internal BGE-M3 endpoint
#   - MILVUS_ADDRESS — internal Milvus (RETRIEVER_BACKEND=milvus)
#   - SKILLFORGE_DATA_SALT (optional, only if Skill author salt differs)

name: eval-gate

on:
  pull_request:
    branches: [main, phase-*]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      judge_model:
        description: 'Judge model id (overrides $JUDGE_MODEL). Defaults to glm-5.2.'
        required: false
        default: 'glm-5.2'

permissions:
  contents: read

jobs:
  eval-gate:
    name: Frozen compliance replay + gate
    # D-09: live secrets are withheld from fork PRs and Dependabot runs, so
    # the live gate must not be reached by either. Non-pull_request events
    # (push to main, workflow_dispatch) stay enabled; same-repository PRs
    # keep the live gate. The trigger itself is deliberately unchanged —
    # widening it would hand fork-controlled workflow code base-repo
    # secrets (D-11 forbids that trigger class outright).
    if: >
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Secrets → env (only place that reads them; not echoed in logs).
      GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
      BGE_M3_URL: ${{ secrets.BGE_M3_URL }}
      MILVUS_ADDRESS: ${{ secrets.MILVUS_ADDRESS }}
      # CI never pins the production model; the live gate uses the
      # ambient JUDGE_MODEL. workflow_dispatch can override.
      JUDGE_MODEL: ${{ github.event.inputs.judge_model || 'glm-5.2' }}
      BGE_M3_MODEL: bge-m3
      RETRIEVER_BACKEND: milvus
      SQLITE_DSN: ':memory:'
      # Pin platform floor so the audit row carries the same
      # platform-floor version the local UAT produces (Phase 24 / PLAT-10).
      PLATFORM_FLOOR_VERSION: 1.1.0
      SKIP_HISTORY_PIPELINE: 'true'
      GOCACHE: ${{ github.workspace }}/.gocache
      GOMODCACHE: ${{ github.workspace }}/.gomodcache

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build cmd/eval
        working-directory: ${{ github.workspace }}
        run: go build -o ./bin/eval ./cmd/eval

      - name: Run frozen compliance replay
        # WR-03: without `shell: bash` GitHub runs `bash -e {0}` (no pipefail),
        # so the pipeline reports tee's status and a non-zero ./bin/eval exit
        # is discarded. `set -o pipefail` stays in the body as belt-and-braces
        # so the intent survives a later removal of the `shell:` key.
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -o pipefail
          mkdir -p eval/reports/ci
          ./bin/eval \
            --frozen compliance \
            --report eval/reports/ci/compliance.json \
            --calibration eval/reports/ci/compliance-calibration.json \
            2>&1 | tee eval/reports/ci/run.log

      - name: Gate check
        working-directory: ${{ github.workspace }}
        run: |
          # Exit code != 0 fails the workflow. Threshold comes from
          # examples/skills/compliance/eval-gate.json.
          ./bin/eval \
            --gate-check eval/reports/ci/compliance.json \
            --skills-dir examples/skills

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-gate-report-${{ github.run_id }}
          path: |
            eval/reports/ci/compliance.json
            eval/reports/ci/compliance-calibration.json
            eval/reports/ci/run.log
          retention-days: 14

  # D-10: a skipped job still reports "Success" on GitHub, so without this
  # sibling the fork / Dependabot skip would be indistinguishable from a real
  # live-gate pass (the CI-side twin of Phase 47 HIGH-1). This job runs on
  # exactly the complement of the gate above and says out loud what happened.
  eval-gate-skip-notice:
    name: eval-gate skipped (fork / Dependabot)
    if: >
      github.event_name == 'pull_request' &&
      (github.event.pull_request.head.repo.full_name != github.repository ||
       github.actor == 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Announce the skip
        run: |
          echo "::notice::eval-gate skipped: live secrets are unavailable to fork and Dependabot PRs, so the live compliance gate did not run. This is NOT a live-gate pass (D-09/D-10)."
