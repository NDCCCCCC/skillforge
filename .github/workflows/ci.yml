# CI — SkillForge public quality gate (Phase 48, CICD-01)
#
# Pinned action majors: actions/checkout@v7, golangci/golangci-lint-action@v9,
# and the toolchain majors behind .github/actions/setup (setup-go@v7,
# setup-node@v7, setup-buildx-action@v4). The Go version itself is never a
# literal — it comes from go.mod through the composite.
#
# TWO INVARIANTS THAT ARE EASY TO UNDO BY ACCIDENT:
#
#   1. NO PATH-TRIGGER FILTERS ANYWHERE IN THIS FILE (no `on:`-block path keys,
#      and no ignore-list variant of them either).
#      Branch protection matches the job name; a path-filtered workflow leaves
#      a required check Pending forever on a PR that touches no matched path.
#      A per-line skip must be a job-level `if:`, never a trigger filter.
#      IN-08 (48-11, option F): the BASE branch carries the same
#      Pending-forever hazard, and it is handled as a documented closed set —
#      pull_request runs exist only for bases [main, 'phase-*'] (the trigger
#      block below). A PR based on any other long-lived branch — release/*, a
#      hotfix/* line — starts no CI at all, so widening the set is a deliberate
#      trade (runner minutes on every base), decided by editing this header and
#      the trigger together, never by dropping the filter silently.
#
#   2. NO SECRET-CONTEXT REFERENCES ANYWHERE IN THIS FILE (no repository or
#      organisation secret interpolation).
#      The whole go line is hermetic by construction — it declares only
#      CGO_ENABLED, so the spike commands stay on their t.Skip path and
#      `go test ./...` needs no live Milvus / BGE-M3 / GLM.
#
# Three independent jobs: `go` (CICD-01), `fe` (CICD-02), and `docker`
# (CICD-03). Every job checks out first and then calls the repository-local
# composite toolchain action.

name: CI

on:
  pull_request:
    # Widened to match eval-gate.yml's existing base set: a PR targeting a
    # `phase-*` base must not silently never start CI.
    branches: [main, 'phase-*']
  push:
    # push is limited to main for the same reason as above — the lint action
    # has no diff on a manual/push run and would fall back to whole-repo lint
    # over ~175 legacy findings.
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Required by only-new-issues (D-29): the action fetches the PR diff via
      # pulls.get. Without this scope it only console.warns and silently
      # degrades to whole-repo lint — the "reported green but did not run"
      # class. No mutating scope is granted anywhere in this workflow.
      pull-requests: read
    env:
      CGO_ENABLED: "1"
    steps:
      # Checkout FIRST (D-30): a repo-local composite action resolves from
      # github.workspace and cannot bootstrap its own checkout.
      # IN-10: this job runs `go test ./...` over fork-authored content and is
      # the only job with an extra scope, so the runner token is not persisted
      # into the checkout's local git config.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          node: "false"

      - name: build + vet (P1)
        run: |
          go build ./...
          go vet ./internal/ontology/... ./internal/server/... ./internal/knowledge/...

      - name: lint (changed lines)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          only-new-issues: true

      - name: go test ./... (CICD-01 / D-15)
        run: go test ./... -count=1

      - name: determinism -count=100 (P5a)
        run: go test ./internal/knowledge/ -run '^TestDeriveEdgesDeterministic$' -count=100

      - name: determinism -shuffle=on with seed (P5b)
        # The trailing -v is mandatory (D-19): Go prints -test.shuffle <seed>
        # only under -v, so without it a red run is unreproducible.
        run: go test ./internal/knowledge/ ./internal/ontology/... -count=1 -shuffle=on -v

  # CICD-02 / SC-2: the frontend gate. Checks out first, then installs the
  # lockfile, typechecks, and runs the whole Vitest suite. No job-level
  # permissions block: the workflow ceiling (`contents: read`) is all it needs.
  fe:
    name: fe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          go: "false"

      - name: install
        working-directory: web
        run: npm ci

      - name: typecheck
        working-directory: web
        run: npx tsc --noEmit

      - name: unit tests
        working-directory: web
        run: npx vitest run

  # CICD-03 / SC-3: both images build from the repository root, and neither is
  # ever published or loaded. Each image gets its own GHA cache scope — the
  # default `buildkit` scope makes the second build evict the first's cache.
  # The compose-driven build path is deliberately absent: the compose file
  # interpolates required live-service variables, so building through it would
  # force CI to fake secrets for a build that does not need them.
  docker:
    name: docker
    runs-on: ubuntu-latest
    # 45 minutes: `golang:1.25-alpine` is a floating tag that can lag the
    # go.mod patch level (forcing an in-image toolchain download), and the
    # CGO compile layer is invalidated by `COPY . .` on every commit.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          go: "false"
          node: "false"
          buildx: "true"

      - name: build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # IN-07 (48-11, option A): the phase verifier itself runs in CI. Drift
  # between verify-phase-48.sh and the workflows it guards now turns a push or
  # PR red instead of rotting silently on a maintainer's host. This is a
  # FOURTH published job name (D-21): branch protection matches job names, so
  # renaming `verify` later would strand any rule that references it.
  #
  # The script demands golangci-lint exactly v2.12.2 on PATH (its own preflight
  # refuses any other binary), so the job installs that one version from the
  # official install script. Reusing the go job's lint action here would drag
  # in its push-run whole-repo fallback — the exact unmeasured surface WR-06
  # leaves open — which this job must not inherit: it lints the script's
  # sentinel modules, never the repository.
  #
  # No job-level permissions: the workflow ceiling (`contents: read`) is all
  # the script touches, strictly narrower than the go job's surface (D-29).
  # No step-level `if:` anywhere (the 48-07 rule) and no non-blocking escape.
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Checkout FIRST (D-30), then the repository-local composite — P5's
      # checkout-before-setup rule covers every job in this file.
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          go: "true"
          node: "false"

      - name: install pinned golangci-lint
        run: |
          LINT_BIN="$(go env GOPATH)/bin"
          mkdir -p "$LINT_BIN"
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$LINT_BIN" v2.12.2
          echo "$LINT_BIN" >> "$GITHUB_PATH"

      - name: python deps for the gate (PyYAML)
        run: python -m pip install --quiet --disable-pip-version-check pyyaml

      - name: phase gate self-proof
        run: bash verify-phase-48.sh
