#
# CI —— 构建、静态检查、竞态检测、覆盖率。
#
# 设计取舍（2026-11-09）：
#   - 默认 job 必须能在**从未见过本仓库的机器**上全绿。任何需要外部服务
#     （Milvus / MongoDB / LLM 端点）的断言都不进默认 job —— 那些走
#     hermetic 替身，或者留给 eval-gate.yml（带 secrets）。
#   - `-race` 不是可选项。本项目的信任主张建立在「并发下依然 fail-closed」
#     上：tier 过滤、审批裁决、审计写入都是并发路径。只跑普通 `go test`
#     等于不测这一层。
#   - 覆盖率只作工件留存，不设阈值门槛。用一个拍出来的百分比当门禁会
#     诱导写无断言的空测试；这里给趋势，不给分数。

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.planning/**'
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 固定工具链，避免 minor 漂移让 CI 结果不可复现。
  GO_VERSION: '1.25.5'
  NODE_VERSION: '22'

jobs:
  backend:
    name: Backend (build · vet · race · coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # go-duckdb 与 mattn/go-sqlite3 都需要 CGO。ubuntu-latest 自带 gcc，
      # 这里只显式确认并打印版本，出问题时日志能直接定位。
      - name: Verify CGO toolchain
        run: |
          gcc --version | head -n 1
          go env CGO_ENABLED

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        # 只报告，不阻断：仓库历史上有格式化漂移，硬门禁会让第一个 PR
        # 面对几百行无关 diff。新增漂移会在这里显形。
        run: |
          out=$(gofmt -l . | grep -v '^$' || true)
          if [ -n "$out" ]; then
            echo "::warning::以下文件未 gofmt："
            echo "$out"
          fi

      # 关键一步：-race。并发路径上的 fail-closed 断言（tier 过滤、
      # 审批归属校验、审计写入）只在竞态检测下才有意义。
      - name: go test -race
        run: |
          go test -race -count=1 \
            -covermode=atomic \
            -coverprofile=coverage.out \
            ./internal/... ./cmd/...

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.out ]; then
            go tool cover -func=coverage.out | tail -n 1
          else
            echo "no coverage.out produced"
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend (typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      # tsc 严格模式是前端的主要正确性防线（vitest 只覆盖有测试的组件）。
      - name: Typecheck (tsc --noEmit)
        working-directory: web
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        working-directory: web
        run: npx vitest run

      # ESLint 从零引入，首次运行有 31 处历史基线违规（清单见
      # web/eslint-baseline.md）。清零前这一步「可见但不阻断」：
      # 失败会出现在 CI 日志和 step 状态里，但不让 merge 变红。
      #
      # 不选「先不跑 lint」：那样技术债在 CI 里完全看不见。也不选
      # 「关掉规则让它绿」：那才是真正的假绿。清零后删掉
      # continue-on-error，这一步就自动变成硬门禁。
      - name: "Lint (baseline: 31 known violations)"
        working-directory: web
        continue-on-error: true
        run: npm run lint

      - name: Production build
        working-directory: web
        run: npm run build

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: warn
          retention-days: 7

  # 结构门禁：这些脚本锁定的是「不许回退」的架构不变量（tier 隔离不许
  # 绕过、SQL 生成面不许存在、信任根只读等）。它们比单元测试更接近项目
  # 的对外主张，所以单独一个 job，失败信息也更清晰。
  structural-gates:
    name: Structural gates (verify-phase-41)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: verify-phase-41 (tier isolation cannot be bypassed)
        run: |
          chmod +x verify-phase-41.sh
          bash verify-phase-41.sh

  # 汇总 job：branch protection 只需勾这一个，避免新增 job 时忘记更新规则。
  ci-ok:
    name: CI OK
    if: always()
    needs: [backend, frontend, structural-gates]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any upstream job failed
        run: |
          echo "backend=${{ needs.backend.result }}"
          echo "frontend=${{ needs.frontend.result }}"
          echo "structural-gates=${{ needs.structural-gates.result }}"
          if [ "${{ needs.backend.result }}" != "success" ] \
          || [ "${{ needs.frontend.result }}" != "success" ] \
          || [ "${{ needs.structural-gates.result }}" != "success" ]; then
            echo "::error::CI 未全绿"
            exit 1
          fi
